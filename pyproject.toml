[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetdesk-lite-ui"
version = "0.0.1"
description = "React component for FleetDesk Lite operations control tower"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "FleetDesk Lite", email = "hello@fleetdesk.example" }]
dependencies = ["streamlit >= 1.51"]

[project.optional-dependencies]
devel = [
  "wheel",
  "pytest==7.4.0",
  "playwright==1.48.0",
  "requests==2.31.0",
  "pytest-playwright-snapshot==1.0",
  "pytest-rerunfailures==12.0",
]

[tool.setuptools.packages.find]
include = ["fleetdesk_lite_ui*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
fleetdesk_lite_ui = ["frontend/build/**/*", "pyproject.toml"]
